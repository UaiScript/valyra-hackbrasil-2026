name: CI

on:
  push:
    branches: ["**"]

  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  postgres:
    name: PostgreSQL / Compose
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Validar PostgreSQL
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 60 postgres
          docker compose exec -T postgres sh -c '
            export PGPASSWORD="$POSTGRES_PASSWORD"
            exec psql -h 127.0.0.1 -U "$POSTGRES_USER" -d "$POSTGRES_DB" \
              -v ON_ERROR_STOP=1 -c "SELECT 1;"
          '

  api:
    name: API
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@94527f2e458b27549849d47d273a16bec83a01e9 # v7
        with:
          version: '0.13.7'
          python-version: '3.12'
          enable-cache: false
      - name: Instalar dependências oficiais
        run: make sync
      - name: Lint e arquitetura
        run: make lint
      - name: Domínio sem PostgreSQL
        env:
          DATABASE_URL: postgresql+psycopg://127.0.0.1:1/unreachable
          TEST_DATABASE_URL: postgresql+psycopg://127.0.0.1:1/unreachable_test
        run: make test-domain
      - name: Iniciar PostgreSQL isolado do runner
        run: |
          cp .env.example .env
          docker compose config --quiet
          docker compose up -d --wait --wait-timeout 60 postgres
          docker compose exec -T postgres sh -c '
            export PGPASSWORD="$POSTGRES_PASSWORD"
            exec psql -h 127.0.0.1 -U "$POSTGRES_USER" -d valyra_test -v ON_ERROR_STOP=1 -c "SELECT 1;"
          '
      - name: Migrações e sincronismo
        run: |
          make migrate
          uv run --locked --env-file "$PWD/.env" --directory services/api alembic check
          uv run --locked --directory services/api python -c 'from alembic.config import Config; from alembic.script import ScriptDirectory; heads = ScriptDirectory.from_config(Config("alembic.ini")).get_heads(); assert len(heads) == 1, heads'
      - name: Suíte integrada em banco dedicado
        run: make test
      - name: Contrato gerado e documentação
        run: |
          make openapi
          git diff --exit-code -- packages/contracts/
          test -z "$(git ls-files --others --exclude-standard -- packages/contracts/)"
          python infra/check_docs.py
