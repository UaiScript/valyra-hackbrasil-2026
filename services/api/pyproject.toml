[project]
name = "valyra-api"
version = "0.1.0"
description = "Persistência do Finance do Valyra"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "alembic>=1.14,<2",
    "psycopg[binary]>=3.2,<4",
    "pydantic-settings>=2.7,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "python-multipart>=0.0.20,<1",
    # zoneinfo no Windows não tem a base IANA do sistema; core/clock usa America/Sao_Paulo.
    "tzdata>=2024.1; sys_platform == 'win32'",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "httpx>=0.28,<1", "ruff>=0.9,<1", "import-linter>=2.1,<3"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/valyra"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = ["postgres: requer TEST_DATABASE_URL apontando para PostgreSQL dedicado"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.isort]
known-third-party = ["alembic", "sqlalchemy"]

[tool.importlinter]
root_package = "valyra"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Core não depende de Finance"
type = "forbidden"
source_modules = ["valyra.core"]
forbidden_modules = ["valyra.finance"]

[[tool.importlinter.contracts]]
name = "Core não depende de Alerts"
type = "forbidden"
source_modules = ["valyra.core"]
forbidden_modules = ["valyra.alerts"]

[[tool.importlinter.contracts]]
name = "Alerts não importa Finance"
type = "forbidden"
source_modules = ["valyra.alerts"]
forbidden_modules = ["valyra.finance"]

[[tool.importlinter.contracts]]
name = "Finance usa Alerts só pelo service"
type = "forbidden"
source_modules = ["valyra.finance"]
forbidden_modules = [
    "valyra.alerts.router", "valyra.alerts.schemas", "valyra.alerts.domain",
    "valyra.alerts.repository", "valyra.alerts.models",
]
# O service de Alerts importa os próprios models e repository; o caminho indireto é permitido.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "Domínio Alerts sem banco, HTTP, IA ou configuração"
type = "forbidden"
source_modules = ["valyra.alerts.domain"]
forbidden_modules = [
    "sqlalchemy", "fastapi", "httpx", "requests", "openai", "google", "valyra.core",
]

[[tool.importlinter.contracts]]
name = "Camadas do Alerts"
type = "layers"
layers = [
    "valyra.alerts.router",
    "valyra.alerts.service",
    "valyra.alerts.domain | valyra.alerts.repository",
]

[[tool.importlinter.contracts]]
name = "Domínio Finance sem banco, HTTP ou IA"
type = "forbidden"
source_modules = ["valyra.finance.domain"]
forbidden_modules = ["sqlalchemy", "fastapi", "httpx", "requests", "openai", "google"]

[[tool.importlinter.contracts]]
name = "Analytics Finance sem banco, HTTP, IA ou configuração"
type = "forbidden"
source_modules = ["valyra.finance.analytics"]
forbidden_modules = [
    "sqlalchemy", "fastapi", "httpx", "requests", "openai", "google", "valyra.core",
]

[[tool.importlinter.contracts]]
name = "Camadas do Finance"
type = "layers"
layers = [
    "valyra.finance.router",
    "valyra.finance.service",
    "valyra.finance.domain | valyra.finance.analytics | valyra.finance.repository",
]
